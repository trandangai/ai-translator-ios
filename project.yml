name: AITranslator
options:
  bundleIdPrefix: com.aitranslator
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  AITranslatorCore:
    path: Packages/AITranslatorCore
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    INFOPLIST_FILE: AITranslator/Resources/Info.plist

targets:
  AITranslator:
    type: application
    platform: iOS
    sources:
      - path: AITranslator
        excludes:
          - "**/*.md"
    dependencies:
      - package: AITranslatorCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: Firebase
        product: FirebaseAI
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aitranslator.ios
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"

  AITranslatorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AITranslatorTests
    dependencies:
      - target: AITranslator
      - package: AITranslatorCore

  AITranslatorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AITranslatorUITests
    dependencies:
      - target: AITranslator
